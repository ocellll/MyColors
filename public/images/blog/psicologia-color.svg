<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD93D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cool" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4D96FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6BCB77;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="#f8f9fa" />
  
  <!-- Abstract Shapes representing emotions -->
  <circle cx="200" cy="225" r="150" fill="url(#warm)" opacity="0.8" filter="url(#blur)" />
  <circle cx="600" cy="225" r="150" fill="url(#cool)" opacity="0.8" filter="url(#blur)" />
  
  <!-- Intersecting area representing balance -->
  <circle cx="400" cy="225" r="100" fill="#9333ea" opacity="0.6" mix-blend-mode="multiply" />
  
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="#e5e7eb" stroke-width="2" />
</svg>
