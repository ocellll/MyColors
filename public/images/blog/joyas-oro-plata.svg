<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C59123;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A9A9A9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="#1f2937" />
  
  <!-- Split Screen Design -->
  <path d="M0 0 L400 0 L300 450 L0 450 Z" fill="url(#gold)" opacity="0.9" />
  <path d="M800 0 L400 0 L300 450 L800 450 Z" fill="url(#silver)" opacity="0.9" />
  
  <!-- Central Element -->
  <circle cx="350" cy="225" r="50" fill="none" stroke="white" stroke-width="2" opacity="0.5" />
  
  <text x="50" y="400" font-family="Arial, sans-serif" font-size="24" fill="#78350f" font-weight="bold">WARM</text>
  <text x="650" y="400" font-family="Arial, sans-serif" font-size="24" fill="#111827" font-weight="bold">COOL</text>
</svg>
