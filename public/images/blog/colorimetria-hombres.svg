<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#374151" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="#111827" />
  <rect width="800" height="450" fill="url(#grid)" opacity="0.2" />
  
  <!-- Stylized Shirt and Suit -->
  <!-- Shirt -->
  <path d="M300 450 L300 200 L400 150 L500 200 L500 450 Z" fill="#ffffff" />
  <!-- Tie -->
  <path d="M400 150 L370 200 L400 400 L430 200 Z" fill="#dc2626" />
  <!-- Suit Jacket -->
  <path d="M200 450 L200 180 L300 220 L300 450" fill="#1e3a8a" />
  <path d="M600 450 L600 180 L500 220 L500 450" fill="#1e3a8a" />
  <!-- Collar -->
  <path d="M300 200 L400 250 L500 200 L400 150 Z" fill="#e5e7eb" opacity="0.5" />
  
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="30" fill="#9ca3af" letter-spacing="4">MEN'S STYLE</text>
</svg>
